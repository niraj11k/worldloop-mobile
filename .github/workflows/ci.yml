name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Advisories appear against dependencies that have not changed, and the
    # audit-allowlist.json exceptions expire on a date rather than on a commit.
    # A weekly run surfaces both without waiting for someone to push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # WL-202: recomputes every WCAG AA pairing from src/theme/palette.ts.
      # --check also fails if the committed matrix is stale, so a palette
      # change cannot land without its verified matrix landing alongside it.
      - name: Contrast gate
        run: npm run contrast:verify -- --check

      # WL-201: fonts resolve silently in RN — a misnamed family or an
      # unlinked file renders the system face with no error at all. This
      # checks the chain from the strings the app references down to the
      # PostScript names inside the TTFs, plus both native projects' links.
      - name: Font integrity gate
        run: npm run fonts:verify

      # WL-407: the attribution notices in Settings are licence obligations,
      # and their sources live outside the app — the licence review doc and
      # the bundled OFL files. A paraphrase in the app copy satisfies nobody
      # and looks perfectly fine on screen, so it is checked here instead.
      - name: Attribution notices gate
        run: npm run attributions:verify

      # Fails on any advisory that is not a reviewed, unexpired exception in
      # audit-allowlist.json, and on exceptions that have gone stale. See the
      # "Dependency audit state" section of README.md.
      - name: Dependency audit gate
        run: npm run audit:ci

  # WL-004: native platforms must actually compile, not just typecheck.
  # Gated on `verify` so a lint/test failure doesn't burn expensive macOS
  # minutes on a PR that was already going to fail.
  build-ios:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS (Debug, Simulator)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace WordLoop.xcworkspace \
            -scheme WordLoop \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
